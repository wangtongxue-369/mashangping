name: Frontend CI

# 前端构建门禁：npm ci + build + test 失败即阻断。
# 判题沙箱 IT（*IT）由后端 surefire 默认排除，本 CI 不跑 Docker——与后端链路互不干扰。
on: [push, pull_request]

jobs:
  frontend-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
